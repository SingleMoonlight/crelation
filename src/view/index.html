<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>CReation</title>
    <!-- 该路径必须是相对于插件根目录的路径，而且需要位于第一个属性位置 -->
    <script src="src/view/lib/d3.min.js"></script>
    <script type="module">
        let rootData = null;
        let treemap = null;
        // 是否已经收到过树数据，用于判断占位提示该不该显示
        let hasTreeData = false;
        let i = 0,
            duration = 200, // 动画时间
            root;

        function transformData(data, parent = null) {
            let rootName = Object.keys(data)[0];
            let root = { name: rootName, children: [], parent: parent };
            data[rootName].calledBy.forEach(item => {
                root.children.push({
                    name: item.caller,
                    filePath: item.filePath,
                    lineNumber: item.lineNumber,
                    children: [],
                    parent: root
                });
            });
            return root;
        }

        // 宽度由 svg 的 100% 自适应，只需高度用于树的垂直居中
        let margin = { top: 20, right: 90, bottom: 30, left: 90 },
            height = document.getElementById('view').clientHeight - margin.top - margin.bottom;

        // 缩放行为绑定在 <svg> 元素上，变换则作用在其内部的 <g> 上
        const svgRoot = document.querySelector('#view svg');
        // 记录当前的缩放和平移状态，面板尺寸变化时在此基础上修正
        let currentTransform = d3.zoomIdentity;

        const zoomBehavior = d3.zoom()
            .filter(function (event) {
                // 禁用双击事件、鼠标滚动和触摸板/触摸屏的捏合手势
                return event.type !== 'dblclick' && event.type !== 'wheel' && event.type !== 'touchstart';
            })
            .on("zoom", function (event) {
                currentTransform = event.transform;
                svg.attr("transform", event.transform);
            });

        let svg = d3.select(svgRoot)
            .attr("width", "100%")
            .attr("height", "100%")
            .call(zoomBehavior)
            .append("g")
            .attr("transform", `translate(${margin.left}, ${height / 2}) scale(1)`); // 设置初始位置

        // 将视图重置到垂直居中的初始位置
        function resetView() {
            d3.select(svgRoot).call(zoomBehavior.transform, d3.zoomIdentity.translate(margin.left, height / 2).scale(1));
        }

        // 模拟一次缩放和平移操作，将树拖到垂直居中
        resetView();

        // 底部面板的高度会被用户随时拖动，尺寸变化时按高度差的一半平移，使树保持垂直居中，同时不丢失当前的缩放和平移
        let lastHeight = height;
        new ResizeObserver(() => {
            const newHeight = document.getElementById('view').clientHeight - margin.top - margin.bottom;

            if (Math.abs(newHeight - lastHeight) < 1) {
                return;
            }

            const delta = (newHeight - lastHeight) / 2;
            lastHeight = newHeight;
            height = newHeight;

            // 触发一次缩放事件，事件回调中会更新 currentTransform
            d3.select(svgRoot).call(zoomBehavior.transform, currentTransform.translate(0, delta));
        }).observe(document.getElementById('view'));

        function collapse(d) {
            if (d.children) {
                d._children = d.children;
                d._children.forEach(collapse);
                d.children = null;
            }
        }

        function initTreeData(treeData) {
            // 有数据了，隐藏占位提示
            hasTreeData = true;
            document.getElementById('placeholder').classList.add('hidden');

            rootData = transformData(treeData);
            // 设置节点的宽度和高度间隔
            treemap = d3.tree().nodeSize([50, 0]);

            root = d3.hierarchy(rootData, function (d) { return d.children; });
            root.x0 = height / 2;
            root.y0 = 0;
            if (root.children) {
                root.children.forEach(collapse);
            }
            // 面板模式会复用同一个视图，重置视图避免沿用上一次的平移和缩放导致树跑到视野外
            resetView();
            update(root);
        }

        function update(source) {
            let treeData = treemap(root);
            let nodes = treeData.descendants(),
                links = treeData.descendants().slice(1);

            // 创建一个临时的 SVG 组来计算文本宽度
            let tempGroup = svg.append("g").attr("class", "temp-group");

            // 计算每个节点的宽度
            nodes.forEach(d => {
                const text = tempGroup.append("text")
                    .attr("class", "temp-text")
                    .attr("font-family", "sans-serif")
                    .attr("font-size", "12px")
                    .text(d.data.name)
                    .node();

                // 设置节点的宽度
                d.nodeWidth = text.getBoundingClientRect().width + 20;
                // 移除临时文本
                d3.select(text).remove();
            });

            // 移除临时组
            tempGroup.remove();

            // 计算每一层级中最长宽度的节点
            let maxNodeWidthPerDepth = {};
            nodes.forEach(d => {
                if (!maxNodeWidthPerDepth[d.depth]) {
                    maxNodeWidthPerDepth[d.depth] = 0;
                }
                if (d.nodeWidth > maxNodeWidthPerDepth[d.depth]) {
                    maxNodeWidthPerDepth[d.depth] = d.nodeWidth;
                }
            });

            // 动态调整每个节点的水平位置和垂直位置
            nodes.forEach(d => {
                if (d.depth === 0) {
                    d.y = 0; // 根节点水平位置为0
                } else {
                    d.y = d.parent.y + maxNodeWidthPerDepth[d.depth - 1] + 50; // 基于父节点的宽度和一个固定间隔设置水平位置
                }
            });

            let node = svg.selectAll('g.node')
                .data(nodes, d => d.id || (d.id = ++i));

            let nodeEnter = node.enter().append('g')
                .attr('class', 'node')
                .attr("transform", d => "translate(" + source.y0 + "," + source.x0 + ")")
                .on('click', click)
                .on('contextmenu', contextmenu);

            nodeEnter.append('rect')
                .attr('class', 'node')
                .attr('height', 30)
                .attr('x', 0)
                .attr('y', -15)
                .attr('width', d => d.nodeWidth)

            nodeEnter.append('text')
                .attr("dy", ".35em")
                .attr("x", d => (d.nodeWidth) / 2) // 文本居中
                .attr("text-anchor", "middle")
                .text(d => d.data.name);

            // 绘制折叠符号
            nodeEnter.filter(d => d._children)
                .append('circle')
                .attr('class', 'expand-symbol')
                .attr('cx', d => d.nodeWidth + 6) // 挨在节点右侧
                .attr('cy', 0)
                .attr('r', 6)

            nodeEnter.filter(d => d._children)
                .append('line')
                .attr('class', 'expand-symbol')
                .attr('x1', d => d.nodeWidth + 3)
                .attr('y1', 0)
                .attr('x2', d => d.nodeWidth + 9)
                .attr('y2', 0)

            nodeEnter.filter(d => d._children)
                .append('line')
                .attr('class', 'expand-symbol')
                .attr('x1', d => d.nodeWidth + 6)
                .attr('y1', -3)
                .attr('x2', d => d.nodeWidth + 6)
                .attr('y2', 3)

            nodeEnter.filter(d => d.depth !== 0)
                .on('mouseover', function (event, d) {
                    d3.select(this).append("text")
                        .attr("class", "tooltip")
                        .attr("x", 10) // 信息与节点文本左侧对齐
                        .attr("y", 30) // 信息在节点下方
                        .text(`File: ${d.data.filePath}, Line: ${d.data.lineNumber}`);
                }).on('mouseout', function (event, d) {
                    d3.select(this).select("text.tooltip").remove();
                });

            let nodeUpdate = nodeEnter.merge(node);

            nodeUpdate.transition()
                .duration(duration)
                .attr("transform", d => "translate(" + d.y + "," + d.x + ")");

            nodeUpdate.select('rect.node')
                .attr('cursor', 'pointer')

            nodeUpdate.selectAll('circle.expand-symbol').remove();
            nodeUpdate.selectAll('line.expand-symbol').remove();

            nodeUpdate.filter(d => d._children)
                .append('circle')
                .attr('class', 'expand-symbol')
                .attr('cx', d => d.nodeWidth + 6) // Position to the right of the node
                .attr('cy', 0)
                .attr('r', 6)

            nodeUpdate.filter(d => d._children)
                .append('line')
                .attr('class', 'expand-symbol')
                .attr('x1', d => d.nodeWidth + 3)
                .attr('y1', 0)
                .attr('x2', d => d.nodeWidth + 9)
                .attr('y2', 0)

            nodeUpdate.filter(d => d._children)
                .append('line')
                .attr('class', 'expand-symbol')
                .attr('x1', d => d.nodeWidth + 6)
                .attr('y1', -3)
                .attr('x2', d => d.nodeWidth + 6)
                .attr('y2', 3)

            let nodeExit = node.exit().transition()
                .duration(duration)
                .attr("transform", d => "translate(" + source.y + "," + source.x + ")")
                .remove();

            nodeExit.select('rect')
                .attr('width', 1e-6)
                .attr('height', 1e-6);

            nodeExit.select('text')
                .style('fill-opacity', 1e-6);

            let link = svg.selectAll('polyline.link')
                .data(links, d => d.id);

            let linkEnter = link.enter().insert('polyline', "g")
                .attr("class", "link")
                .attr('points', d => {
                    let o = { x: source.x0, y: source.y0 };
                    return `${o.y},${o.x} ${o.y},${o.x} ${o.y},${o.x}`;
                })

            let linkUpdate = linkEnter.merge(link);

            linkUpdate.transition()
                .duration(duration)
                .attr('points', d => {
                    const parentWidth = d.parent.nodeWidth;
                    const childWidth = d.nodeWidth;
                    const parentY = d.parent.y + parentWidth;
                    const childY = d.y;
                    // 弯折点靠近子节点，保持第三段折线长度为20
                    const bendY = childY - 20;
                    return `${parentY},${d.parent.x} ${bendY},${d.parent.x} ${bendY},${d.x} ${childY},${d.x}`;
                });

            let linkExit = link.exit().transition()
                .duration(duration)
                .attr('points', d => {
                    let o = { x: source.x, y: source.y };
                    return `${o.y},${o.x} ${o.y},${o.x} ${o.y},${o.x}`;
                })
                .remove();

            svg.selectAll('polyline.link')
                .attr("marker-start", "url(#arrow)");

            nodes.forEach(d => {
                d.x0 = d.x;
                d.y0 = d.y;
            });
        }

        svg.append("defs").append("marker")
            .attr("id", "arrow")
            .attr("viewBox", "0 -5 10 10")
            .attr("refX", 0)
            .attr("refY", 0)
            .attr("markerWidth", 4)
            .attr("markerHeight", 4)
            .attr("orient", "auto")
            .append("path")
            .attr("d", "M10,-5L0,0L10,5")
            .attr("class", "arrow");

        function diagonal(s, d) {
            return `${s.y},${s.x} ${(s.y + d.y) / 2},${s.x} ${(s.y + d.y) / 2},${d.x} ${d.y},${d.x}`;
        }

        // 获取 VS Code API 实例
        const vscodeApi = window.acquireVsCodeApi();
        // 中间变量存储当前点击的节点
        let currentClickedNode = null;

        // 发送请求获取子节点
        function fetchChildNodes(nodeName) {
            const message = {
                command: 'fetchChildNodes',
                nodeName: nodeName
            };
            vscodeApi.postMessage(message);
        }

        // 发送函数调用信息
        function sendFunctionCallerInfo(info) {
            const message = {
                command: 'sendFunctionCallerInfo',
                functionCallerInfo: info
            };
            vscodeApi.postMessage(message);
        }

        // 根据结果显示位置切换占位提示的文案
        function updatePlaceholderMode(message) {
            const placeholder = document.getElementById('placeholder');
            placeholder.dataset.mode = message.position === 'bottom' ? 'bottom' : 'tab';
            placeholder.classList.toggle('hidden', message.host !== 'view' || hasTreeData);
        }

        // 接收来自VSCode消息
        function receiveMessageFromVscode() {
            window.addEventListener('message', event => {
                const message = event.data;
                switch (message.command) {
                    case "receiveTreeData":
                        // 初始化树数据
                        initTreeData(message.treeData);
                        break;
                    case 'updatePosition':
                        // 更新占位提示，说明结果会显示在哪里
                        updatePlaceholderMode(message);
                        break;
                    case 'receiveChildNodes':
                        // 处理从VSCode发送的子节点数据
                        updateNodeWithChildData(currentClickedNode, message.childNodes);
                        break;
                    default:
                        break;
                }
            });
        }

        // 更新节点数据
        function updateNodeWithChildData(node, childData) {
            const newChildrenData = transformData(childData).children;
            node.data.children = newChildrenData;

            const newHierarchy = d3.hierarchy(node.data, function (d) { return d.children; });
            node.children = newHierarchy.children;

            if (node.children) {
                // 初始化新子节点的位置
                node.children.forEach(child => {
                    child.depth = node.depth + 1;
                    child.x = node.x;
                    child.y = node.y;
                    child.parent = node;
                });
            }

            update(node);
        }

        function click(event, d) {
            if (d.children) {
                d._children = d.children;
                d.children = null;
                update(d);
            } else if (d._children) {
                d.children = d._children;
                d._children = null;
                update(d);
            } else {
                currentClickedNode = d; // 存储当前点击的节点
                fetchChildNodes(d.data.name);
            }
        }

        function contextmenu(event, d) {
            // 禁用默认的右键菜单
            event.preventDefault();
            sendFunctionCallerInfo({
                filePath: d.data.filePath,
                lineNumber: d.data.lineNumber
            })
        }

        // 初始化时调用接收消息的函数
        document.addEventListener('DOMContentLoaded', () => {
            receiveMessageFromVscode();
            // 监听器注册好之后再主动查询显示位置，避免扩展过早发送的消息丢失
            vscodeApi.postMessage({ command: 'requestPosition' });

            // 点击按钮把结果显示位置切到本面板
            document.getElementById('use-panel-button').addEventListener('click', () => {
                vscodeApi.postMessage({ command: 'useBottomPosition' });
            });
        });
    </script>
    <style>
        body {
            display: block;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
        }

        body #view {
            display: block;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        /* 尚未查询任何函数时显示，收到树数据后隐藏 */
        #placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 0 24px;
            text-align: center;
            pointer-events: none;
            font: 13px sans-serif;
            color: var(--vscode-descriptionForeground);
        }

        #placeholder.hidden {
            display: none;
        }

        /* 两套文案按显示位置二选一，mode 由扩展通过 updatePosition 消息设置 */
        /* 标题、说明、按钮之间用 gap 控制间距，所以这里必须是 flex 布局 */
        #placeholder > div {
            display: none;
        }

        #placeholder[data-mode="bottom"] .only-bottom,
        #placeholder[data-mode="tab"] .only-tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        #placeholder .placeholder-title {
            margin: 0;
            font-size: 15px;
            color: var(--vscode-foreground);
        }

        #placeholder .placeholder-hint {
            margin: 0;
        }

        #placeholder code {
            padding: 1px 4px;
            border-radius: 3px;
            background: var(--vscode-textCodeBlock-background);
            font-family: var(--vscode-editor-font-family, monospace);
        }

        #placeholder button {
            pointer-events: auto;
            margin-top: 10px;
            padding: 4px 12px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font: inherit;
            color: var(--vscode-button-foreground);
            background: var(--vscode-button-background);
        }

        #placeholder button:hover {
            background: var(--vscode-button-hoverBackground);
        }

        .node rect {
            fill: var(--vscode-editor-background);
            stroke: var(--vscode-editor-foreground);
            stroke-width: 2px;
        }

        .node text {
            font: 12px sans-serif;
            fill: var(--vscode-editor-foreground);
            cursor: pointer;
        }

        .link {
            fill: none;
            stroke: var(--vscode-editor-foreground);
            stroke-width: 2px;
        }

        .arrow {
            fill: var(--vscode-editor-foreground);
        }

        .expand-symbol {
            fill: none;
            stroke: var(--vscode-editor-foreground);
            stroke-width: 2px;
            cursor: pointer;
        }
        
    </style>
</head>

<body>
    <div id="view">
        <svg></svg>
        <!-- 默认隐藏：只有底部面板视图需要它，编辑器标签页一创建就带着数据 -->
        <div id="placeholder" class="hidden" data-mode="tab">
            <!-- 位置为bottom时：结果会显示在本面板 -->
            <div class="only-bottom">
                <p class="placeholder-title">No relations to show</p>
                <p class="placeholder-hint">Select a function name in a C file, then run <strong>Show Relations</strong> from the right-click menu.</p>
            </div>
            <!-- 其他位置时：结果会显示在编辑器标签页，这里始终为空 -->
            <div class="only-tab">
                <p class="placeholder-title">Relations open in an editor tab</p>
                <p class="placeholder-hint">Use <code>crelation.relationsPosition</code> to choose where the call chain is shown.</p>
                <button id="use-panel-button" type="button">Show relations in this panel</button>
            </div>
        </div>
    </div>
</body>

</html>
